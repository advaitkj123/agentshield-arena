[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "agentshield-arena"
version = "1.0.0"
description = "Adversarially Resilient AI Agents for IT Incident Response"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["ai-safety", "prompt-injection", "agent-security", "policy-enforcement", "incident-response"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
dashboard = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
]
llm = [
    "openai>=1.30.0",
    "anthropic>=0.25.0",
]
all = [
    "agentshield-arena[dev,dashboard,llm]",
]

[project.scripts]
agentshield = "src.main:main"
agentshield-benchmark = "src.benchmark:run_benchmark"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
