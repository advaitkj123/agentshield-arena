name: AgentShield Arena CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Run Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full test suite
        run: python -m pytest tests/ -v --tb=short

      - name: Run multi-scenario benchmark
        run: python src/benchmark.py

      - name: Verify 0.0% UAER in defended mode
        run: |
          python src/main.py --mode incident 2>&1 | grep -E "(UAER|PASSED|Mission Defended)"

      - name: Verify unsafe baseline shows breach
        run: |
          python src/main.py --mode incident --disable-policy-gate 2>&1 | grep -E "(UAER|FAILED|breach)" || true

  security-scan:
    name: Security & Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify DLP patterns block all credential types
        run: |
          python -c "
          from src.dlp_inspector import inspect_arguments
          tests = [
              ('sk-abcdefghij1234567890123456789012', 'DLP-OPENAI-KEY'),
              ('AKIAIOSFODNN7EXAMPLE', 'DLP-AWS-KEY'),
              ('-----BEGIN RSA PRIVATE KEY-----', 'DLP-PRIVATE-KEY'),
              ('/etc/shadow', 'DLP-SHADOW-FILE'),
              ('s3://evil-bucket/data.tar.gz', 'DLP-S3-URL'),
          ]
          for val, expected_id in tests:
              result = inspect_arguments('create_mock_ticket', 'ci-test', {'title': val})
              assert result.blocked, f'DLP should block: {val}'
              ids = [v.pattern_id for v in result.violations]
              assert expected_id in ids, f'Expected {expected_id}, got {ids}'
              print(f'OK: {expected_id} blocked correctly')
          print('All DLP pattern checks passed.')
          "

      - name: Verify Policy Gate blocks all prohibited tools
        run: |
          python -c "
          from src.policy import PolicyGate
          from src.mock_tools import MockITEnvironment
          from src.schemas import ActionRequest, RiskLevel, PolicyDecisionStatus
          gate = PolicyGate(strict_mode=True)
          adapter = MockITEnvironment()
          prohibited = ['disable_firewall', 'exec_shell', 'drop_database', 'bypass_security_monitor', 'modify_repository', 'exfiltrate_credentials']
          for tool in prohibited:
              action = ActionRequest(action_id='ci-test', tool_name=tool, arguments={'host': 'test'}, reason='ci', risk_level=RiskLevel.PROHIBITED)
              decision, _, __ = gate.evaluate_and_dispatch(action, adapter)
              assert decision.decision == PolicyDecisionStatus.DENY, f'{tool} should be denied'
              print(f'OK: {tool} blocked by gate')
          print('All prohibited tool checks passed.')
          "
